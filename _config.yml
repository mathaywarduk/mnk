url: "https://bagelbagel.world"
title: "The Adventures of Mat & Kez"
plugins:
  - jekyll-postcss
  - jekyll-minifier
image_base: https://mathayward.imgix.net/
video_base: https://mathaywarduk.s3.eu-west-2.amazonaws.com/
exclude:
  - package-lock.json
  - postcss.config.js
  - tailwind.config.js
  - publish.sh
permalink: /:year/:title
image_widths: [320, 480, 640, 800, 1024, 1280, 1600, 1920, 2560]
jekyll-minifier:
  # CSS is minified by cssnano (see postcss.config.js) – this one breaks clamp()
  compress_css: false
  uglifier_args:
    harmony: true
# The postcss cache only notices changes to files imported directly by
# styles.scss, so edits to _postcss/* partials get missed without this.
postcss:
  cache: false
