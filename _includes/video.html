<div class="drop-shadow-base shrink-0 w-auto relative snap-start {{ include.block_classes }}" data-video>
  <video class="{{ include.classes }}" loop muted playsinline>
    <source src="{{ site.video_base }}{{ include.url | replace: 'mp4', 'webm' }}" type="video/webm" />
    <source src="{{ site.video_base }}{{ include.url }}" type="video/mp4" />
  </video>
</div>
